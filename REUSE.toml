version = 1

# Everything in this repository is BSD-2-Clause. The explicit dotfile/.github
# entries are needed because glob `**` does not descend into hidden paths.
# Note: when ncurses is vendored (macOS builds, -DUSE_SYSTEM_NCURSES=off) the
# vendored sources are fetched at build time and are NOT committed; they are
# distributed under the ncurses MIT-style license (see vendor/ when fetched).
[[annotations]]
path = ["**", ".github/**", ".clang-format", ".editorconfig", ".gitignore", "LICENSE"]
SPDX-License-Identifier = "BSD-2-Clause"
SPDX-FileCopyrightText = "2025 The Reynard contributors"
