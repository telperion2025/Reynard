name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CMake, warnings as errors)
        run: cmake -B build -DRX_WERROR=on -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j 2
      - name: Test (selftest + conformance under ASan/UBSan)
        run: |
          cmake -B build-san -DRX_WERROR=on \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-san -j 2
          # LSan is unsupported on macOS; keep leak detection on Linux only.
          if [ "$RUNNER_OS" = "macOS" ]; then export ASAN_OPTIONS=detect_leaks=0; else export ASAN_OPTIONS=detect_leaks=1; fi
          ctest --test-dir build-san --output-on-failure
          ctest --test-dir build --output-on-failure
      - name: Plain-make build (Makefile.simple)
        run: |
          make -f Makefile.simple clean
          make -f Makefile.simple
          ./reynard-harness selftest
          ./reynard-harness conformance tests/conformance "$PWD/reynard" testdata/gen .test-work
          ./reynard-harness roundtrip testdata/gen .test-work
          ./reynard-harness lockrace .test-work
          ./reynard-harness golden tests/golden "$PWD/reynard" testdata/gen .test-work
          ./reynard-harness cdx .test-work

  conformance-index:
    name: Conformance index freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check INDEX.md covers every case
        run: |
          for f in tests/conformance/*.prg; do
            b=$(basename "$f" .prg)
            grep -q "$b" tests/conformance/INDEX.md || { echo "missing INDEX.md entry: $b"; exit 1; }
          done

  format:
    name: Format (.clang-format + .editorconfig, spec 11.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned clang-format
        run: pip install clang-format==23.1.5
      - name: clang-format --dry-run --Werror
        run: |
          FILES=$(find src include tests -name '*.c' -o -name '*.h')
          clang-format --dry-run --Werror $FILES
      - name: .editorconfig subset
        run: python3 scripts/check_editorconfig.py

  reuse:
    name: REUSE license compliance (spec 11.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reuse
        run: pip install reuse
      - name: reuse lint
        run: reuse lint

  docs:
    name: Doxygen docs + public API gate (spec 11.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Public API documentation gate
        run: python3 scripts/check_doxygen_public.py
      - name: Build API docs (make docs equivalent)
        run: doxygen Doxyfile
      - name: Publish to docs branch (best effort)
        continue-on-error: true
        run: |
          git config user.email "ci@localhost"
          git config user.name "reynard-ci"
          mkdir -p /tmp/docs-site && cp -R build/docs/html/* /tmp/docs-site/
          git checkout --orphan docs 2>/dev/null || git checkout docs
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/docs-site/* .
          git add -A && git commit -m "API docs for ${{ github.sha }}" || true
          git push origin docs --force || echo "docs branch push skipped (permissions)"
      - uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/docs/html

  fuzz:
    name: Fuzz libFuzzer fuzz_dbf (spec 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure with ENABLE_FUZZ (ASan+UBSan)
        run: |
          CC=clang cmake -B build-fuzz -DENABLE_FUZZ=on -DRX_WERROR=on \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
      - name: Build fuzz_dbf
        run: cmake --build build-fuzz --target fuzz_dbf -j 2
      - name: Run seed corpus, then fuzz (crash = job failure)
        run: |
          mkdir -p fuzz-corpus
          ./build-fuzz/tests/fuzz/fuzz_dbf testdata/gen/fuzz-seeds \
              -runs=200000 -max_total_time=300 -artifact_prefix=fuzz-corpus/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-corpus
          path: fuzz-corpus/

  package:
    name: Package ${{ matrix.os }} (CPack, spec 13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm dpkg-dev
      - name: Build Release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DRX_WERROR=on
          cmake --build build -j 2
      - name: CPack DEB/RPM/TGZ (ubuntu)
        if: runner.os == 'Linux'
        run: cd build && cpack -G DEB -G RPM -G TGZ
      - name: macOS universal2 zip + ZIP (macos)
        if: runner.os == 'macOS'
        run: |
          ./packaging/macos/make-universal2-zip.sh v1.0.0 || true
          cd build && cpack -G ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.zip
            reynard-*-macos-universal2.zip

  static-analysis:
    name: Static analysis (cppcheck/clang-tidy, documented, spec 12)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy
      - name: Configure with compile_commands
        run: cmake -B build -DRX_WERROR=on -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --std=c17 \
            --language=c --inline-suppr -I include -I src \
            --xml --output-file=cppcheck.xml src tests 2>&1 | tee cppcheck.log
          echo "cppcheck findings: $(grep -c '<error ' cppcheck.xml || true)"
      - name: clang-tidy (advisory)
        run: |
          cmake --build build -j 2
          run-clang-tidy -p build -quiet src 2>&1 | tee clang-tidy.log || true
          echo "clang-tidy findings: $(grep -c 'warning:' clang-tidy.log || true)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            cppcheck.xml
            cppcheck.log
            clang-tidy.log
