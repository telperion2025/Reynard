# Example reynard.cfg — place at $XDG_CONFIG_HOME/reynard/reynard.cfg
# (override with --cfg <file> or the REYNARD_CFG environment variable).
# One statement per line; '#' starts a comment; parse errors print a
# line-numbered warning and are skipped (spec §10.2).

# Command history ring size (persisted to $XDG_CACHE_HOME/reynard/history)
HISTORY = 1000

# Default code page for files without a language-driver mark
CODEPAGE_DEFAULT = 1252

# Mouse backend negotiation: auto|sgr|u1000|1002|1015|gpm|sysmouse|off
MOUSE = auto

# Example: bind F12 to a macro (any SET keyword is valid here, plus extras)
F12 = "DO mymacro"

# Example: custom color scheme (FoxPro 16-slot color pair list)
# COLOR SCHEME 3 = "W+/B, W+/BG, W+/B, ..."
